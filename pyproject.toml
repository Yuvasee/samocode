[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samocode"
version = "0.0.1"
description = "Walk-away AI coding sessions, locally orchestrated"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Yuri Vasilchikov", email = "yuri.v9v@gmail.com" }]
keywords = ["claude", "claude-code", "codex", "ai", "agent", "orchestrator", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "python-dotenv>=1.0.0",
  "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/Yuvasee/samocode"
Repository = "https://github.com/Yuvasee/samocode"
Issues = "https://github.com/Yuvasee/samocode/issues"

[project.scripts]
samocode = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"workflow.md" = "workflow.md"
"agents" = "agents"
"skills" = "skills"
"commands" = "commands"

[tool.hatch.build.targets.sdist]
include = [
  "main.py",
  "worker/",
  "agents/",
  "skills/",
  "commands/",
  "workflow.md",
  "README.md",
  "LICENSE",
  "CLAUDE.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", ".ruff_cache", "dist", "logs", "worktrees", "_sessions"]

[tool.ruff]
exclude = [".git", ".pytest_cache", ".ruff_cache", "dist", "logs", "worktrees", "_sessions"]
